name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.18' }
      - run: npm test
      - name: the derived contract must match the vendored spec
        run: |
          node scripts/extract-semconv.mjs
          git diff --exit-code data/semconv-contract.json
      - run: npm run report
